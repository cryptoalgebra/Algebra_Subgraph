type EternalFarming @entity(immutable: false) {
  id: ID!
  rewardToken: Bytes!
  bonusRewardToken: Bytes!
  virtualPool: Bytes!
  pool: Bytes!
  nonce: BigInt!
  reward: BigInt!
  bonusReward: BigInt!
  rewardRate: BigInt!
  bonusRewardRate: BigInt!
  isDeactivated: Boolean
  minRangeLength: BigInt!
}

type Deposit @entity(immutable: false) {
  id: ID!
  owner: Bytes!
  pool: Bytes!
  eternalFarming: Bytes 
  liquidity: BigInt!
}

type Reward @entity(immutable: false){
  id: ID!
  rewardAddress: Bytes!
  amount: BigInt!
  owner: Bytes!
}

type PositionTransferCache @entity(immutable: false) {
  # unique identifier for position transfer cache
  id: ID!
  # new owner after transfer
  owner: Bytes!
}

type FarmingBuffer @entity(immutable: false) {
  # pool address, or the zero address for the global default buffer
  id: ID!
  pool: Bytes!
  buffer: BigInt!
}

type RewardsForfeitedEvent @entity(immutable: false) {
  # transaction hash + tokenId + incentiveId. Lets the FarmEnded handler (which
  # fires right after, in the exitFarming forfeiture path) detect that this
  # farm's accrued reward for this tx was diverted to the protocol bucket
  # instead of paid to the owner, so it doesn't double-count or misattribute it.
  id: ID!
  tokenId: BigInt!
  incentiveId: Bytes!
  owner: Bytes!
  reward: BigInt!
  bonusReward: BigInt!
  timestamp: BigInt!
}